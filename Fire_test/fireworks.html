<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烟花燃放模拟器</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #020810 60%, #000 100%);
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  #starsCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  #fireworkCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  #btnContainer {
    position: fixed;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 20px;
  }

  .actionBtn {
    padding: 14px 40px;
    font-size: 18px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 3px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    outline: none;
    transition: all 0.3s ease;
    white-space: nowrap;
  }

  #fireBtn {
    background: linear-gradient(135deg, #e63946, #f77f00);
    box-shadow: 0 4px 24px rgba(230, 57, 70, 0.5), 0 0 60px rgba(247, 127, 0, 0.3);
  }

  #fireBtn:hover {
    transform: scale(1.06);
    box-shadow: 0 6px 32px rgba(230, 57, 70, 0.7), 0 0 80px rgba(247, 127, 0, 0.5);
  }

  #fireBtn:active {
    transform: scale(0.94);
    transition: transform 0.1s ease;
  }

  #meteorBtn {
    background: linear-gradient(135deg, #4a60ff, #00b4d8);
    box-shadow: 0 4px 24px rgba(74, 96, 255, 0.5), 0 0 60px rgba(0, 180, 216, 0.3);
  }

  #meteorBtn:hover {
    transform: scale(1.06);
    box-shadow: 0 6px 32px rgba(74, 96, 255, 0.7), 0 0 80px rgba(0, 180, 216, 0.5);
  }

  #meteorBtn:active {
    transform: scale(0.94);
    transition: transform 0.1s ease;
  }

  #hint {
    position: fixed;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    color: rgba(255, 255, 255, 0.5);
    font-size: 13px;
    letter-spacing: 2px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <canvas id="starsCanvas"></canvas>
  <canvas id="fireworkCanvas"></canvas>
  <div id="btnContainer">
    <button id="fireBtn" class="actionBtn">🎆 放 烟 花</button>
    <button id="meteorBtn" class="actionBtn">☄️ 流 星</button>
  </div>
  <div id="hint">点击按钮燃放烟花或流星</div>

  <script>
  (() => {
    // ==================== DOM Elements ====================
    const starsCanvas = document.getElementById('starsCanvas');
    const starsCtx = starsCanvas.getContext('2d');
    const fwCanvas = document.getElementById('fireworkCanvas');
    const fwCtx = fwCanvas.getContext('2d');
    const fireBtn = document.getElementById('fireBtn');
    const meteorBtn = document.getElementById('meteorBtn');
    const hintEl = document.getElementById('hint');

    let cw, ch;

    // ==================== Resize ====================
    function resize() {
      cw = window.innerWidth;
      ch = window.innerHeight;
      starsCanvas.width = cw;
      starsCanvas.height = ch;
      fwCanvas.width = cw;
      fwCanvas.height = ch;
      drawStars();
    }

    // ==================== Star Background ====================
    let stars = [];

    function generateStars() {
      stars = [];
      const count = Math.floor((cw * ch) / 1800);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * cw,
          y: Math.random() * ch,
          r: Math.random() * 1.6 + 0.3,
          alpha: Math.random() * 0.7 + 0.3,
          twinkleSpeed: Math.random() * 0.02 + 0.005,
          twinkleOffset: Math.random() * Math.PI * 2,
        });
      }
    }

    function drawStars() {
      generateStars();
      starsCtx.clearRect(0, 0, cw, ch);
      for (const s of stars) {
        starsCtx.beginPath();
        starsCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        starsCtx.fillStyle = `rgba(255,255,255,${s.alpha})`;
        starsCtx.fill();
      }
      // Draw a few larger, brighter stars with cross spikes
      const brightCount = Math.floor(stars.length * 0.04);
      for (let i = 0; i < brightCount; i++) {
        const b = stars[Math.floor(Math.random() * stars.length)];
        starsCtx.save();
        starsCtx.strokeStyle = `rgba(255,255,255,${b.alpha * 0.6})`;
        starsCtx.lineWidth = 0.5;
        starsCtx.beginPath();
        starsCtx.moveTo(b.x - b.r * 4, b.y);
        starsCtx.lineTo(b.x + b.r * 4, b.y);
        starsCtx.moveTo(b.x, b.y - b.r * 4);
        starsCtx.lineTo(b.x, b.y + b.r * 4);
        starsCtx.stroke();
        starsCtx.restore();
      }
    }

    // ==================== Color Utilities ====================
    const PALETTES = [
      // Reds
      ['#ff1a40', '#ff4060', '#ff6680', '#ff8ca0'],
      // Oranges
      ['#ff5e00', '#ff8020', '#ffa040', '#ffc060'],
      // Golds
      ['#ffcc00', '#ffdd33', '#ffe666', '#ffef99'],
      // Greens
      ['#00e640', '#33ff66', '#66ff88', '#99ffaa'],
      // Blues
      ['#0066ff', '#3388ff', '#66aaff', '#99ccff'],
      // Purples
      ['#7700ff', '#9933ff', '#bb66ff', '#dd99ff'],
      // Pinks
      ['#ff0088', '#ff33a0', '#ff66bb', '#ff99d0'],
      // Cyans
      ['#00ccff', '#33d9ff', '#66e5ff', '#99f0ff'],
    ];

    function randomPalette() {
      return PALETTES[Math.floor(Math.random() * PALETTES.length)];
    }

    function randomColorFromPalette(palette) {
      return palette[Math.floor(Math.random() * palette.length)];
    }

    function randomHSLColor() {
      const h = Math.floor(Math.random() * 360);
      const s = 80 + Math.floor(Math.random() * 20);
      const l = 50 + Math.floor(Math.random() * 20);
      return `hsl(${h}, ${s}%, ${l}%)`;
    }

    // ==================== Particle Class ====================
    class Particle {
      constructor(x, y, options = {}) {
        this.x = x;
        this.y = y;
        this.vx = options.vx ?? (Math.random() - 0.5) * 8;
        this.vy = options.vy ?? (Math.random() - 0.5) * 8;
        this.color = options.color ?? '#ffffff';
        this.alpha = options.alpha ?? 1;
        this.size = options.size ?? Math.random() * 2.5 + 1;
        this.gravity = options.gravity ?? 0.06;
        this.friction = options.friction ?? 0.98;
        this.decay = options.decay ?? 0.012 + Math.random() * 0.01;

        // Shape/text forming
        this.targetX = options.targetX ?? null;
        this.targetY = options.targetY ?? null;
        this.phase = options.phase ?? 'free'; // 'free' | 'forming' | 'hold' | 'falling'
        this.holdTimer = 0;
        this.holdDuration = options.holdDuration ?? 50;
        this.formSpeed = options.formSpeed ?? 0.05;
        this.formDelay = options.formDelay ?? 0;
        this._swapPhase = options._swapPhase ?? false;
      }

      update() {
        if (this.formDelay > 0) {
          this.formDelay--;
          this.vy += this.gravity;
          this.vx *= this.friction;
          this.vy *= this.friction;
          this.x += this.vx;
          this.y += this.vy;
          return;
        }

        if (this.targetX !== null && this.phase === 'forming') {
          const dx = this.targetX - this.x;
          const dy = this.targetY - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 0.6) {
            this.phase = 'hold';
            this.holdTimer = 0;
            this.vx = 0;
            this.vy = 0;
          } else {
            this.x += dx * this.formSpeed;
            this.y += dy * this.formSpeed;
          }
        } else if (this.phase === 'hold') {
          this.holdTimer++;
          if (this.holdTimer >= this.holdDuration) {
            this.phase = 'falling';
            this.vx = (Math.random() - 0.5) * 3;
            this.vy = -Math.random() * 2;
          }
        } else {
          this.vy += this.gravity;
          this.vx *= this.friction;
          this.vy *= this.friction;
          this.x += this.vx;
          this.y += this.vy;
        }

        this.alpha -= this.decay;
        if (this.alpha < 0) this.alpha = 0;
      }

      draw(ctx) {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = this.phase === 'hold' ? 10 : 6;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      get dead() {
        return this.alpha <= 0;
      }
    }

    // ==================== Text Position Cache ====================
    const textPosCache = {};

    function getTextPixelPositions(text) {
      if (textPosCache[text]) return textPosCache[text];

      const offCanvas = document.createElement('canvas');
      const offCtx = offCanvas.getContext('2d');
      const fontSize = 70;
      offCtx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", "SimHei", sans-serif`;
      const metrics = offCtx.measureText(text);
      const tw = metrics.width;
      const th = fontSize;
      offCanvas.width = Math.ceil(tw) + 20;
      offCanvas.height = th + 20;
      offCtx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", "SimHei", sans-serif`;
      offCtx.fillStyle = '#ffffff';
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      offCtx.fillText(text, offCanvas.width / 2, offCanvas.height / 2);

      const imageData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
      const pixels = imageData.data;
      const positions = [];
      const step = 3;

      for (let y = 0; y < offCanvas.height; y += step) {
        for (let x = 0; x < offCanvas.width; x += step) {
          const idx = (y * offCanvas.width + x) * 4;
          if (pixels[idx + 3] > 100) {
            positions.push({
              x: x - offCanvas.width / 2,
              y: y - offCanvas.height / 2,
            });
          }
        }
      }

      textPosCache[text] = positions;
      return positions;
    }

    // ==================== Firework Class ====================
    class Firework {
      constructor() {
        // Rocket
        const margin = cw * 0.08;
        this.x = margin + Math.random() * (cw - margin * 2);
        this.y = ch;
        this.vy = -(9 + Math.random() * 5);
        this.vx = (Math.random() - 0.5) * 0.8;
        this.targetY = ch * 0.12 + Math.random() * ch * 0.42;

        this.trail = [];
        this.maxTrail = 14;
        this.sparks = [];

        this.exploded = false;
        this.particles = [];
        this.flashAlpha = 0;
        this.flashX = 0;
        this.flashY = 0;

        this.type = this._randomType();
        this.palette = randomPalette();
      }

      _randomType() {
        const r = Math.random();
        if (r < 0.45) return 'normal';
        if (r < 0.72) return 'shape';
        return 'text';
      }

      get done() {
        return this.exploded && this.particles.length === 0 && this.flashAlpha <= 0;
      }

      get totalParticles() {
        return this.particles.length + this.sparks.length;
      }

      update() {
        if (!this.exploded) {
          this.y += this.vy;
          this.x += this.vx;

          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > this.maxTrail) this.trail.shift();

          // Emit sparks along the way
          if (Math.random() < 0.35) {
            this.sparks.push({
              x: this.x + (Math.random() - 0.5) * 5,
              y: this.y,
              vx: (Math.random() - 0.5) * 1.5,
              vy: Math.random() * 2 + 0.5,
              alpha: 0.9,
              decay: 0.04 + Math.random() * 0.06,
              size: Math.random() * 1.5 + 0.5,
            });
          }

          // Update trailing sparks
          for (const s of this.sparks) {
            s.x += s.vx;
            s.y += s.vy;
            s.alpha -= s.decay;
          }
          this.sparks = this.sparks.filter(s => s.alpha > 0);

          if (this.y <= this.targetY) {
            this._explode();
          }
        } else {
          for (const p of this.particles) p.update();
          this.particles = this.particles.filter(p => !p.dead);

          if (this.flashAlpha > 0) {
            this.flashAlpha -= 0.025;
            if (this.flashAlpha < 0) this.flashAlpha = 0;
          }
        }
      }

      _explode() {
        this.exploded = true;
        this.flashX = this.x;
        this.flashY = this.y;
        this.flashAlpha = 0.9;

        const maxRadius = Math.min((cw * 2 / 3) / 2, ch * 0.42);

        if (this.type === 'normal') {
          this._createNormalExplosion(maxRadius);
        } else if (this.type === 'shape') {
          this._createShapeExplosion(maxRadius);
        } else {
          this._createTextExplosion();
        }
      }

      _createNormalExplosion(maxRadius) {
        const count = 90 + Math.floor(Math.random() * 70);
        const usingPalette = Math.random() < 0.6;

        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.5 + Math.random() * 7;
          const color = usingPalette
            ? randomColorFromPalette(this.palette)
            : randomHSLColor();

          this.particles.push(new Particle(this.flashX, this.flashY, {
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color,
            size: Math.random() * 2.8 + 0.8,
            gravity: 0.04 + Math.random() * 0.04,
            friction: 0.97 + Math.random() * 0.02,
            decay: 0.01 + Math.random() * 0.016,
          }));
        }

        // Inner brighter core
        const coreCount = 25 + Math.floor(Math.random() * 15);
        for (let i = 0; i < coreCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 3;
          this.particles.push(new Particle(this.flashX, this.flashY, {
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: '#ffffff',
            size: Math.random() * 1.5 + 0.5,
            gravity: 0.03,
            friction: 0.96,
            decay: 0.02 + Math.random() * 0.02,
          }));
        }
      }

      _createShapeExplosion(maxRadius) {
        const shapes = ['heart', 'smiley', 'flower'];
        const shape = shapes[Math.floor(Math.random() * shapes.length)];
        const scale = Math.min(maxRadius / 17, cw / 50);

        let positions;
        if (shape === 'heart') positions = this._heartPositions(scale);
        else if (shape === 'smiley') positions = this._smileyPositions(scale);
        else positions = this._flowerPositions(scale);

        const color = randomColorFromPalette(this.palette);
        const secColor = this.palette[Math.floor(Math.random() * this.palette.length)];

        for (const pos of positions) {
          const jx = (Math.random() - 0.5) * 2;
          const jy = (Math.random() - 0.5) * 2;
          const useAltColor = Math.random() < 0.2;

          this.particles.push(new Particle(
            this.flashX + pos.x + jx,
            this.flashY + pos.y + jy,
            {
              vx: (Math.random() - 0.5) * 1.6,
              vy: (Math.random() - 0.5) * 1.6,
              color: useAltColor ? secColor : color,
              size: Math.random() * 2 + 1,
              gravity: 0.04,
              friction: 0.98,
              decay: 0.01 + Math.random() * 0.012,
            }
          ));
        }
      }

      _heartPositions(scale) {
        const positions = [];
        const steps = 180;
        for (let i = 0; i < steps; i++) {
          const t = (i / steps) * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(t), 3) * scale;
          const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
          positions.push({ x, y });
        }
        // Fill interior with some scattered points
        for (let i = 0; i < 40; i++) {
          const t = Math.random() * Math.PI * 2;
          const r = Math.random() * 0.7;
          const x = 16 * Math.pow(Math.sin(t), 3) * scale * r;
          const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale * r;
          positions.push({ x, y });
        }
        return positions;
      }

      _smileyPositions(scale) {
        const positions = [];
        const faceR = 7 * scale;

        // Face outline
        for (let i = 0; i < 90; i++) {
          const angle = (i / 90) * Math.PI * 2;
          positions.push({ x: Math.cos(angle) * faceR, y: Math.sin(angle) * faceR });
        }
        // Left eye
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          positions.push({ x: -2.5 * scale + Math.cos(a) * scale, y: -2 * scale + Math.sin(a) * scale });
        }
        // Right eye
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          positions.push({ x: 2.5 * scale + Math.cos(a) * scale, y: -2 * scale + Math.sin(a) * scale });
        }
        // Smile
        for (let i = 0; i < 35; i++) {
          const a = Math.PI * 0.15 + (i / 34) * Math.PI * 0.7;
          positions.push({ x: Math.cos(a) * 4.5 * scale, y: 1.5 * scale + Math.sin(a) * 4.5 * scale });
        }
        return positions;
      }

      _flowerPositions(scale) {
        const positions = [];
        const petalCount = 6;
        const petalDist = 3.5 * scale;
        const petalR = 2.2 * scale;

        for (let p = 0; p < petalCount; p++) {
          const baseAngle = (p / petalCount) * Math.PI * 2;
          const cx = Math.cos(baseAngle) * petalDist;
          const cy = Math.sin(baseAngle) * petalDist;
          for (let i = 0; i < 22; i++) {
            const pa = (i / 22) * Math.PI * 2;
            positions.push({
              x: cx + Math.cos(pa) * petalR,
              y: cy + Math.sin(pa) * petalR * 0.6,
            });
          }
        }
        // Center
        for (let i = 0; i < 18; i++) {
          const a = (i / 18) * Math.PI * 2;
          const r = scale * 1.2 * Math.random();
          positions.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
        }
        return positions;
      }

      _createTextExplosion() {
        const texts = ['天天开心', '元气满满', '万事如意', '心想事成', '平安喜乐', '幸福美满'];
        const text = texts[Math.floor(Math.random() * texts.length)];
        const pixelPositions = getTextPixelPositions(text);

        if (pixelPositions.length === 0) {
          // Fallback to normal explosion
          this.type = 'normal';
          this._createNormalExplosion(Math.min((cw * 2 / 3) / 2, ch * 0.42));
          return;
        }

        // Figure out scale to fit within max radius
        const maxRadius = Math.min((cw * 2 / 3) / 2, ch * 0.42) * 0.85;
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (const p of pixelPositions) {
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
        }
        const textW = maxX - minX;
        const textH = maxY - minY;
        const textMaxDim = Math.max(textW, textH);
        const scale = textMaxDim > 0 ? maxRadius / (textMaxDim / 2) : 4;
        const cx = -(minX + textW / 2);
        const cy = -(minY + textH / 2);

        const color = randomColorFromPalette(this.palette);

        for (const pos of pixelPositions) {
          const tx = this.flashX + (pos.x + cx) * scale;
          const ty = this.flashY + (pos.y + cy) * scale;

          this.particles.push(new Particle(this.flashX, this.flashY, {
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            color,
            size: 1.8 + Math.random() * 0.6,
            gravity: 0.04,
            friction: 0.97,
            decay: 0.006 + Math.random() * 0.004,
            targetX: tx,
            targetY: ty,
            phase: 'forming',
            formSpeed: 0.03 + Math.random() * 0.04,
            formDelay: 12 + Math.floor(Math.random() * 16),
            holdDuration: 55 + Math.floor(Math.random() * 35),
          }));
        }
      }

      draw(ctx) {
        // Draw trailing sparks (behind rocket)
        for (const s of this.sparks) {
          ctx.save();
          ctx.globalAlpha = s.alpha;
          ctx.fillStyle = '#ffcc66';
          ctx.shadowColor = '#ffcc66';
          ctx.shadowBlur = 3;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        if (!this.exploded) {
          // Rocket trail
          for (let i = 0; i < this.trail.length; i++) {
            const t = this.trail[i];
            const ratio = i / this.trail.length;
            const alpha = ratio * 0.7;
            const sz = ratio * 2.8;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#ffcc44';
            ctx.shadowColor = '#ffcc44';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(t.x, t.y, sz, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // Rocket head
          ctx.save();
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#ffdd66';
          ctx.shadowBlur = 18;
          ctx.beginPath();
          ctx.arc(this.x, this.y, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Explosion flash
        if (this.flashAlpha > 0) {
          const flashR = 15 + (0.9 - this.flashAlpha) * 80;
          ctx.save();
          ctx.globalAlpha = this.flashAlpha * 0.7;
          const grad = ctx.createRadialGradient(this.flashX, this.flashY, 0, this.flashX, this.flashY, flashR);
          grad.addColorStop(0, 'rgba(255,255,255,1)');
          grad.addColorStop(0.3, 'rgba(255,255,220,0.6)');
          grad.addColorStop(1, 'rgba(255,200,50,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(this.flashX, this.flashY, flashR, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Particles
        for (const p of this.particles) {
          p.draw(ctx);
        }
      }
    }

    // ==================== Meteor Class ====================
    class Meteor {
      constructor() {
        // Start in upper-left to upper-mid area of screen
        this.x = Math.random() * cw * 0.3;
        this.y = Math.random() * ch * 0.28 + ch * 0.02;

        // Angle: 25-55 degrees from horizontal (down-right)
        const angle = (Math.random() * 30 + 25) * Math.PI / 180;
        const speed = 7 + Math.random() * 8;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.color = randomHSLColor();
        this.alpha = 1;
        this.size = 2 + Math.random() * 2.5;

        this.trail = [];
        this.maxTrail = 30;
      }

      get done() {
        return this.x > cw + 40 || this.y > ch + 40 || this.alpha <= 0;
      }

      update() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > this.maxTrail) this.trail.shift();

        this.x += this.vx;
        this.y += this.vy;

        // Start fading when passing mid-screen
        if (this.x > cw * 0.55) {
          this.alpha -= 0.018;
        }
        if (this.alpha < 0) this.alpha = 0;
      }

      draw(ctx) {
        if (this.alpha <= 0) return;

        // Draw trail as tapered circles
        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i];
          const ratio = i / this.trail.length;
          const alpha = ratio * this.alpha * 0.7;
          const sz = ratio * this.size * 0.85;

          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = this.color;
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 3;
          ctx.beginPath();
          ctx.arc(t.x, t.y, sz, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Glow aura around head
        ctx.save();
        ctx.globalAlpha = this.alpha * 0.4;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 22;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Bright head
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Inner hot core
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ==================== Animation Loop ====================
    const fireworks = [];
    const meteors = [];
    const TRAIL_ALPHA = 0.12;
    let frameCount = 0;

    function animate() {
      frameCount++;
      requestAnimationFrame(animate);

      // Trail effect: semi-transparent clear
      fwCtx.fillStyle = `rgba(0, 0, 0, ${TRAIL_ALPHA})`;
      fwCtx.fillRect(0, 0, cw, ch);

      // Twinkle stars (subtle)
      for (const s of stars) {
        s.alpha += Math.sin(frameCount * s.twinkleSpeed + s.twinkleOffset) * 0.003;
        s.alpha = Math.max(0.2, Math.min(1, s.alpha));
      }

      // Update and draw fireworks
      for (let i = fireworks.length - 1; i >= 0; i--) {
        const fw = fireworks[i];
        fw.update();
        fw.draw(fwCtx);
        if (fw.done) {
          fireworks.splice(i, 1);
        }
      }

      // Update and draw meteors
      for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i];
        m.update();
        m.draw(fwCtx);
        if (m.done) {
          meteors.splice(i, 1);
        }
      }

      // Total particle cap
      let totalP = 0;
      for (const fw of fireworks) totalP += fw.totalParticles;
      if (totalP > 6000) {
        // Remove oldest firework's particles
        for (const fw of fireworks) {
          if (fw.exploded && fw.particles.length > 0) {
            fw.particles.splice(0, Math.floor(fw.particles.length * 0.3));
            break;
          }
        }
      }
    }

    // ==================== Launch Helpers ====================
    function launchFirework() {
      fireworks.push(new Firework());
      hideHint();
    }

    function launchMeteor() {
      meteors.push(new Meteor());
      hideHint();
    }

    function hideHint() {
      if (hintEl.style.opacity !== '0') {
        hintEl.style.transition = 'opacity 0.8s ease';
        hintEl.style.opacity = '0';
      }
    }

    // ==================== Event Handlers ====================
    fireBtn.addEventListener('click', () => {
      launchFirework();
      fireBtn.style.transform = 'scale(0.94)';
      setTimeout(() => { fireBtn.style.transform = 'scale(1)'; }, 120);
    });

    meteorBtn.addEventListener('click', () => {
      launchMeteor();
      meteorBtn.style.transform = 'scale(0.94)';
      setTimeout(() => { meteorBtn.style.transform = 'scale(1)'; }, 120);
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        launchFirework();
      } else if (e.code === 'KeyM') {
        e.preventDefault();
        launchMeteor();
      }
    });

    window.addEventListener('resize', () => {
      resize();
    });

    // ==================== Initialization ====================
    resize();
    animate();

    // Auto-launch one firework after a short delay
    setTimeout(() => launchFirework(), 600);

    console.log('🎆 烟花燃放 + ☄️ 流星模拟器已就绪');
    console.log('  - 点击「放烟花」或按空格键燃放烟花');
    console.log('  - 点击「流星」或按 M 键发射流星');
    console.log('  - 烟花：普通 / 形状（爱心·笑脸·花朵）/ 文字烟花');
  })();
  </script>
